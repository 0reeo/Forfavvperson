<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Sampai Di Sini</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/final.css" />
</head>
<body>

<div class="final-wrap">

  <div class="final-wrap">

  <img src="assets/photo.jpg" alt="dia" class="final-photo hidden">

  <p class="final-text">
    Terima kasih sudah sampai di sini.<br>
    Semoga hari ini terasa lebih hangat.
    
      Kalau kamu sampai di sini,<br>
      artinya kamu sudah membaca semuanya.
    
      Aku cuma mau bilang,<br>
      terima kasih sudah ada,<br>
      dengan caramu sendiri.
    </p>

    <p class="small">
      — dari seseorang yang mungkin<br>
      tidak selalu terlihat.
  </p>
</div>

<canvas id="confetti"></canvas>

<audio id="bgMusic" src="assets/music.mp3" loop></audio>

<script>
/* ===== MUSIK (PLAY SETELAH TAP) ===== */
const music = document.getElementById("bgMusic");
document.body.addEventListener("click", () => {
  music.play().catch(()=>{});
}, { once:true });

/* ===== CONFETTI SIMPLE ===== */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const pieces = Array.from({length: 120}).map(() => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 4 + 2,
  d: Math.random() * 1 + 0.5
}));

function drawConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#d4a373";
  pieces.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    p.y += p.d;
    if(p.y > canvas.height) p.y = -10;
  });
  requestAnimationFrame(drawConfetti);
}

drawConfetti();
</script>

</body>
</html>
